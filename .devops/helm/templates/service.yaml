apiVersion: v1
kind: Service
metadata:
  name: {{ include "painel-de-bordo.fullname" . }}
  labels:
    {{- include "painel-de-bordo.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "painel-de-bordo.selectorLabels" . | nindent 4 }}
