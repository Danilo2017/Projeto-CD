image: docker:27-cli

stages:
  - build
  - deploy


default:
  tags:
    - runner-instance

.docker_login: &docker_login
  - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY

.env-script: &env
  - echo Branch Atual - $CI_COMMIT_BRANCH
  - echo Commit Ref Name - $CI_COMMIT_BRANCH
  - |
    if [ "$CI_COMMIT_BRANCH" = "$TAG_BRANCH_QA" ]; then
      cp "$ENV_FILE_QA" ./.env
      cp "$ENV_FILE_QA" ./.devops/helm/.env
    elif [ "$CI_COMMIT_BRANCH" = "$TAG_BRANCH_PROD" ]; then
      cp "$ENV_FILE_PROD" ./.env
      cp "$ENV_FILE_PROD" ./.devops/helm/.env
    elif [ "$CI_COMMIT_BRANCH" = "$TAG_BRANCH_STAGE" ]; then
      cp "$ENV_FILE_STAGE" ./.env
      cp "$ENV_FILE_STAGE" ./.devops/helm/.env
    else
      echo "Branch não reconhecida. Nenhum arquivo de ambiente aplicado."
    fi

docker_image_publish:
  stage: build
  script:
    - *docker_login
    - docker build --tag $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA .
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
  rules:
    - if: "$CI_COMMIT_BRANCH == $TAG_BRANCH_PROD"
    - if: "$CI_COMMIT_BRANCH == $TAG_BRANCH_QA"
    - if: "$CI_COMMIT_BRANCH == $TAG_BRANCH_STAGE"
      when: always
    - when: never


.deploy:
  stage: deploy
  image:
    name: ${CI_EXECUTOR}
    entrypoint: ["/entrypoint.sh"]
  script:
    - *env
    - kubectl create namespace ${NAMESPACE} --dry-run=client -o yaml | kubectl apply -f -
    - kubectl label namespace ${NAMESPACE} --overwrite registry=common tls=${TLS}
    - |-
      helm upgrade ${RELEASE_NAME} --install --namespace ${NAMESPACE} .devops/helm/ \
      --set fullnameOverride=${RELEASE_NAME} \
      --set image.repository=$CI_REGISTRY_IMAGE \
      --set image.tag=$CI_COMMIT_SHORT_SHA \
      --set ingressNginx.hosts[0].host=${HOSTNAME} \
      --set ingressNginx.hosts[0].paths[0].path=/ \
      --set ingressNginx.tls[0].hosts[0]=${HOSTNAME} \
      --set ingressNginx.tls[0].secretName=${SECRET_NAME} \
      --set ingressNginx.enabled=true \
      --set replicaCount=1

deploy_prod:
  extends:
    - .deploy
  environment:
    name: on-premise-prod
  variables:
    TLS: gazin
  dependencies:
    - docker_image_publish
  rules:
    - if: '$CI_COMMIT_BRANCH == $TAG_BRANCH_PROD'
      when: on_success
    - when: never

